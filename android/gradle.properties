# Gradle settings for the whereq-dosbox Android build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app layer is Kotlin + AndroidX (core-ktx, annotation, coroutines). SDL2
# and the emulator stay native (statically linked into libdosbox.so), so the
# AndroidX surface is deliberately small.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.1.4 was only tested up to compileSdk 34. The app itself targets API 21
# and uses no API newer than that, so the "use a newer AGP" warning is noise.
android.suppressUnsupportedCompileSdk=36
