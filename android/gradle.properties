# Gradle settings for the whereq-dosbox Android build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app layer is Kotlin + AndroidX (core-ktx, annotation, coroutines). SDL2
# and the emulator stay native (statically linked into libdosbox.so), so the
# AndroidX surface is deliberately small.
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.5 supports the compile SDK up to API 37, so the "this AGP was not
# tested against that compile SDK" warning is gone and the flag that used to
# silence it (android.suppressUnsupportedCompileSdk) is not needed any more.
