name: CI

# The green bar before a release: the native emulator is built from source
# for all three ABIs and the app is packaged on top of it. The release itself
# is release.yml, which runs on the version tag.
#
# The native build is the expensive part (SDL2 + the whole DOSBox core, three
# times), so the ABIs are built in parallel matrix jobs and the libraries are
# handed to the packaging job as artifacts.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: libdosbox.so (${{ matrix.abi }})
    # Pinned: `ubuntu-latest` is a moving target. Pinning keeps the toolchain
    # identical until we deliberately bump it.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v7

      # nasm assembles the x86 parts of SDL2. Without it SDL2 falls back to
      # the C versions, which still works but is not what the local build
      # produces - keep the two identical.
      - name: install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm

      - uses: android-actions/setup-android@v4
        with:
          # The action's default is "tools platform-tools", and the "tools"
          # package was removed from the SDK repository years ago - asking for
          # it fails the whole job. platform-tools is all the action has to
          # install; the real packages come in the step below.
          packages: 'platform-tools'

      - name: install the SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" \
                     "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"

      # The SDL2 sources are not committed (100+ MB of upstream code); this
      # script makes the dependency reproducible.
      - name: fetch the SDL2 sources
        run: ./third_party/fetch-sdl2.sh

      - name: build libdosbox.so
        run: |
          # env.sh resolves the NDK and cmake from the SDK; point it at the
          # runner's SDK instead of the WSL-local one it defaults to.
          export WQ_ANDROID_SDK="$ANDROID_SDK_ROOT"
          . toolchain/env.sh
          ./android/build-android.sh "${{ matrix.abi }}"

      - name: check the 16 KB page alignment
        run: |
          # Google Play requires every app that targets API 35 or higher to
          # support 16 KB memory pages on 64 bit devices: every PT_LOAD
          # segment of the shipped library has to be aligned to 16 KB.
          # A library that is only 4 KB aligned is rejected by the Play
          # Console rather than by the compiler, so it is checked here.
          #
          # env.sh has to be sourced again here: every step runs in its own
          # shell, so the NDK path the build step exported is not carried
          # over.
          export WQ_ANDROID_SDK="$ANDROID_SDK_ROOT"
          . toolchain/env.sh
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          so="build/android/${{ matrix.abi }}/libdosbox.so"
          aligns=$("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          echo "$aligns"
          for a in $aligns; do
            if (( a < 0x4000 )); then
              echo "::error::a PT_LOAD segment of $so is aligned to $a - it needs 0x4000 (16 KB) or more"
              exit 1
            fi
          done
          echo "all PT_LOAD segments are 16 KB aligned"

      - uses: actions/upload-artifact@v7
        with:
          name: libdosbox-${{ matrix.abi }}
          path: build/android/${{ matrix.abi }}/libdosbox.so
          if-no-files-found: error

  apk:
    name: app (debug APK)
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # AGP 9 needs JDK 17 or newer. JDK 21 is used because the lint
      # task in AGP 9.3 and later crashes on JDK 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # Cache the Gradle dependency tree and the wrapper distribution.
          # Without it every run re-downloads the whole AGP tree from Maven
          # Central, and a rate-limited answer (HTTP 429) fails the build for
          # reasons that have nothing to do with the code.
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: install the SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      # The Gradle module stages the libraries out of build/android/<abi>/,
      # so they have to be in exactly that place.
      - name: collect the native libraries
        uses: actions/download-artifact@v8
        with:
          name: libdosbox-arm64-v8a
          path: build/android/arm64-v8a
      - uses: actions/download-artifact@v8
        with:
          name: libdosbox-armeabi-v7a
          path: build/android/armeabi-v7a
      - uses: actions/download-artifact@v8
        with:
          name: libdosbox-x86_64
          path: build/android/x86_64

      - name: run the unit tests
        run: |
          # The unit tests cover the back-button decision and the manifest
          # rules that the Android 15+ behaviour changes depend on. They run on
          # the JVM, so they cost seconds and need no device.
          #
          # The instrumented test that presses the real back button needs an
          # emulator on API 33+ and is not run here.
          ./android/gradlew --project-dir android :app:testDebugUnitTest --console=plain

      - name: build the debug APK
        run: ./android/gradlew --project-dir android :app:assembleDebug --console=plain

      # A debug APK is enough here: it proves the app layer compiles against
      # the freshly built native libraries. The signed release is release.yml.
      - name: check that all three ABIs are in the APK
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/.*/libdosbox.so'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libdosbox.so" \
              || { echo "::error::$abi is missing from the APK"; exit 1; }
          done
          echo "all three ABIs are packaged"

      - uses: actions/upload-artifact@v7
        with:
          name: whereq-dosbox-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
