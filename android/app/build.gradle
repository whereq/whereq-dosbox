// whereq-dosbox — Android application module (Kotlin + AndroidX).
//
// Gradle is the CANONICAL app build. The emulator core and SDL2 are native and
// built out-of-tree by android/build-android.sh into
// <repo>/build/android/<abi>/libdosbox.so; this module stages that library into
// the APK. (The older no-Gradle android/build-apk.sh drove javac->d8 directly
// and cannot compile Kotlin — it is kept only as a legacy/native-CI helper.)
//
//   ./gradlew assembleDebug     -> build/outputs/apk/debug/app-debug.apk
//   ./gradlew assembleRelease   -> build/outputs/apk/release/app-release.apk
//   ./gradlew bundleRelease     -> build/outputs/bundle/release/app-release.aab
//
// Versions come from gradle/libs.versions.toml. The release signing certificate,
// the v1+v2+v3 schemes and the version mapping are unchanged from the historical
// build (see android/README.md).
//
// The DSL is AGP 9's: the android block assigns properties (compileSdk = 37)
// instead of calling methods (compileSdk 37), and the Kotlin sources are
// compiled by AGP's built-in Kotlin support - the org.jetbrains.kotlin.android
// plugin is not applied.
plugins {
    alias(libs.plugins.android.application)
}

// The ABIs whose native libraries are staged into the APK.
def nativeAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']

// The version is kept in one place so the Gradle build and the legacy
// no-Gradle script can be given the same numbers:
//
//   gradlew assembleRelease -PappVersionCode=7 -PappVersionName=0.7.0
//
// The default comes from the VERSION file at the repo root, which
// bin/release.sh mirrors from the release tag — so the tag is the single
// source of truth. -PappVersionCode / -PappVersionName still win.
def versionFile = rootProject.file('../VERSION')
def repoVersion = versionFile.exists() ? versionFile.text.trim() : '1.0.0.1'
def repoVersionParts = repoVersion.split('\\.')
// versionCode = major*1e6 + minor*1e4 + patch*1e2 + build (monotonic).
// Operators are kept at the end of each line so Groovy continues the
// expression across the line breaks.
def repoVersionCode = 1
if (repoVersionParts.length == 4) {
    repoVersionCode = repoVersionParts[0].toInteger() * 1000000 +
            repoVersionParts[1].toInteger() * 10000 +
            repoVersionParts[2].toInteger() * 100 +
            repoVersionParts[3].toInteger()
}

def appVersionCode = (project.findProperty('appVersionCode') ?: repoVersionCode).toInteger()
def appVersionName = project.findProperty('appVersionName') ?: repoVersion

// The native library is built out-of-tree by android/build-android.sh into
// build/android/<abi>/libdosbox.so. AGP wants the ABI as the first path
// segment below a jniLibs directory, so the libraries are staged there.
def stagedJniLibs = layout.buildDirectory.dir('generated/jniLibs')

// The canonical manifest carries android:package, because aapt2 needs it for
// the legacy no-Gradle build. AGP does not allow that attribute any more —
// the namespace below takes its place — so the Gradle build works on a copy
// with the attribute removed.
def generatedManifest = layout.buildDirectory.file('generated/AndroidManifest.xml')

tasks.register('generateManifest') {
    description = 'Copies the manifest without the android:package attribute'
    def src = file('src/main/AndroidManifest.xml')
    def out = generatedManifest
    inputs.file(src)
    outputs.file(out)
    doLast {
        def text = src.text.replaceAll(/package="com\.whereq\.dosbox"/, '')
        def target = out.get().asFile
        target.parentFile.mkdirs()
        target.text = text
    }
}

tasks.register('stageNativeLibs', Copy) {
    description = 'Copies the NDK-built libdosbox.so into the jniLibs layout'
    into stagedJniLibs
    nativeAbis.each { abi ->
        from("${rootDir}/../build/android/${abi}/libdosbox.so") {
            into abi
        }
    }
}

android {
    namespace = 'com.whereq.dosbox'
    // The compile SDK decides which platform the sources are compiled against.
    // The app itself uses nothing newer than API 23.
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    // AGP 9 would otherwise fall back to NDK r28; the native library is built
    // with r30, so the module is told which NDK the tree is on.
    ndkVersion = '30.0.16248370'
    defaultConfig {
        applicationId = 'com.whereq.dosbox'
        minSdk = 23
        targetSdk = 37
        versionCode = appVersionCode
        versionName = appVersionName

        // The instrumented test that presses the real back button on API 33+.
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            // The release key is never committed. Point the build at it with
            // WHEREQ_RELEASE_KEYSTORE / WHEREQ_RELEASE_STORE_PASS, or put the
            // same values into a keystore.properties file next to this
            // build.gradle:
            //
            //   storeFile=/abs/path/to/release.keystore
            //   storePassword=...
            //   keyAlias=whereq
            //   keyPassword=...
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            // NOTE: the local names deliberately differ from the signingConfig
            // property names. In Groovy a local variable of the same name
            // shadows the setter method, so "storeFile = file(storeFile)" would
            // be parsed as String.call() and fail the build.
            def keystorePath = props['storeFile'] ?: System.getenv('WHEREQ_RELEASE_KEYSTORE')
            def storePass = props['storePassword'] ?: System.getenv('WHEREQ_RELEASE_STORE_PASS')
            def aliasName  = props['keyAlias'] ?: System.getenv('WHEREQ_RELEASE_ALIAS') ?: 'whereq'
            def keyPass   = props['keyPassword'] ?: System.getenv('WHEREQ_RELEASE_KEY_PASS') ?: storePass

            if (keystorePath && storePass) {
                storeFile = file(keystorePath)
                storePassword = storePass
                keyAlias = aliasName
                keyPassword = keyPass
                // Match the historical build: v1 + v2 + v3 signature schemes.
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            } else {
                // Without a key the release build cannot be signed properly.
                // Fall back to the debug key so that "assembleRelease" still
                // produces an installable APK for local testing — it stays
                // debuggable in that case and must not be shipped.
                logger.warn('No release keystore configured — falling back to the debug key. ' +
                        'Set WHEREQ_RELEASE_KEYSTORE and WHEREQ_RELEASE_STORE_PASS for a real release build.')
                storeFile = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }

    buildTypes {
        debug {
            // android:debuggable comes from the build type, not from the
            // manifest, so the release build is not debuggable.
            debuggable = true
            jniDebuggable = true
        }
        release {
            minifyEnabled = false   // see proguard-rules.pro before enabling
            shrinkResources = false
            signingConfig = signingConfigs.release
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs = [stagedJniLibs.get().asFile]
            // AGP refuses a package attribute in the source manifest (the
            // namespace above replaces it), while aapt2 — which the legacy
            // no-Gradle build uses — needs it. So the canonical manifest keeps
            // the package and Gradle works on a copy without it.
            manifest.srcFile(generatedManifest)
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

// AGP 9's built-in Kotlin support replaces the old android.kotlinOptions
// block. The JVM target follows compileOptions.targetCompatibility, but it is
// spelled out here so the two cannot drift apart.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.annotation
    implementation libs.androidx.documentfile
    implementation libs.kotlinx.coroutines.android

    testImplementation libs.junit

    // The instrumented test that presses the real back button on a device.
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.runner
}

tasks.named('preBuild') {
    dependsOn 'stageNativeLibs'
    dependsOn 'generateManifest'
}
