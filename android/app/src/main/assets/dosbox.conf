# DOSBox configuration for Android (whereq-dosbox)
#
# Copied into the app's private files directory on first start and then used
# as the primary configuration (the activity passes "-conf dosbox.conf").
#
# The working directory is the app's files directory (see
# android/jni/dosbox_android.cpp), so relative paths below resolve inside
# the app sandbox.

[sdl]
# The SDL window on Android is always the full screen SurfaceView, so the
# picture has to be scaled by the renderer:
#   output=texture  -> SCREEN_TEXTURE path (SDL_RenderCopy), which scales the
#                      texture into sdl.clip instead of blitting 1:1
#   fullscreen=true + fullresolution=desktop
#                   -> DOSBox computes the aspect-corrected clip for the
#                      current display size and centers it (letterbox)
#   aspect=true     -> the 640x400 DOS picture is corrected to 4:3
#
# renderer is left at "auto": on Android SDL picks its GLES2 renderer, which
# presents with eglSwapBuffers() straight to the SurfaceView. The software
# renderer does not work here, because its SDL_UpdateWindowSurface() needs
# SDL's texture framebuffer on the window - and that framebuffer owns a
# renderer of its own, which conflicts with the renderer of the texture path.
output=texture
fullscreen=true
fullresolution=desktop
# Touch input must not grab the mouse.
autolock=false
waitonerror=false

[dosbox]
memsize=16
nosound=false
# No physical CD-ROM on Android; use IMGMOUNT for CD images.
machine=svga_s3

[cpu]
# No JIT is available on Android: C_DYNREC needs a GCC plugin and
# C_DYNAMIC_X86 is x86-only, so we always run the interpreter core.
core=normal
cycles=auto
cputype=auto
cyclesup=10
cyclesdown=20

[render]
scaler=none
aspect=true

[autoexec]
# Make the app's files directory available as C: and switch to it, so the
# user lands on a C:\> prompt.
mount c .
c:
