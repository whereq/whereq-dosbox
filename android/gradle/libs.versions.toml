# Gradle version catalog for the whereq-dosbox Android build.
#
# Single source of truth for plugin/library versions. The app layer is Kotlin +
# AndroidX; the DOSBox emulator and SDL2 are native (libdosbox.so) and built
# out-of-tree by android/build-android.sh, so they are NOT dependencies here.
#
# Kept intentionally small: the only runtime libraries are the Kotlin stdlib
# (added by AGP's built-in Kotlin support), AndroidX core, annotations and
# coroutines.
#
# The Kotlin *plugin* is not listed here any more: AGP 9 compiles the Kotlin
# sources itself (built-in Kotlin), so the org.jetbrains.kotlin.android plugin
# must NOT be applied. The compiler plugin's version is pinned in the root
# build.gradle instead - see the comment there.

[versions]
agp = "9.5.3"
kotlin = "2.4.21"
coroutines = "1.11.0"
androidx-core = "1.19.1"
androidx-annotation = "1.11.0"
androidx-documentfile = "1.1.0"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidx-documentfile" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
