name: Release

# A version tag (v1.0.0.9) is the trigger. The APK is built here from the
# tagged source - the native emulator for all three ABIs plus the app layer -
# signed with the release key held in the repository secrets, and published as
# a GitHub Release next to the tag.
#
# The release key never leaves the secrets: the keystore is stored base64
# encoded as WHEREQ_RELEASE_KEYSTORE_B64 and decoded into the runner's
# temporary directory at build time. The store password and the key alias
# come from WHEREQ_RELEASE_STORE_PASS and WHEREQ_RELEASE_ALIAS.
#
# The certificate is checked against the known release fingerprint below, so a
# wrong key in the secrets fails the release loudly instead of publishing an
# APK that cannot be installed over the previous one.
#
# A tag push is the normal way in. workflow_dispatch exists for the case where
# the pipeline itself is broken and the tag is already pushed: it takes the tag
# as an input and builds that exact tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build and publish (e.g. v1.0.0.9)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The tag being released. On a tag push that is the pushed tag; on a manual
  # run it is the tag given as the input.
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  native:
    name: libdosbox.so (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nasm

      - uses: android-actions/setup-android@v4
        with:
          # The action's default is "tools platform-tools", and the "tools"
          # package was removed from the SDK repository years ago - asking for
          # it fails the whole job. platform-tools is all the action has to
          # install; the real packages come in the step below.
          packages: 'platform-tools'

      - name: install the SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37.0" \
                     "build-tools;37.0.0" "cmake;3.31.6" "ndk;30.0.16248370"

      - name: fetch the SDL2 sources
        run: ./third_party/fetch-sdl2.sh

      - name: build libdosbox.so
        run: |
          export WQ_ANDROID_SDK="$ANDROID_SDK_ROOT"
          . toolchain/env.sh
          ./android/build-android.sh "${{ matrix.abi }}"

      - uses: actions/upload-artifact@v7
        with:
          name: libdosbox-${{ matrix.abi }}
          path: build/android/${{ matrix.abi }}/libdosbox.so
          if-no-files-found: error

  publish:
    name: build · sign · publish
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # create the GitHub Release for the tag
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # Cache the Gradle dependency tree and the wrapper distribution.
          # Without it every run re-downloads the whole AGP tree from Maven
          # Central, and a rate-limited answer (HTTP 429) fails the release
          # for reasons that have nothing to do with the code.
          cache: gradle

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: install the SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: collect the native libraries
        uses: actions/download-artifact@v8
        with:
          name: libdosbox-arm64-v8a
          path: build/android/arm64-v8a
      - uses: actions/download-artifact@v8
        with:
          name: libdosbox-armeabi-v7a
          path: build/android/armeabi-v7a
      - uses: actions/download-artifact@v8
        with:
          name: libdosbox-x86_64
          path: build/android/x86_64

      # The tag is the single source of truth for the version - it is mirrored
      # into the VERSION file and read by the Gradle build. A tag that does
      # not match would ship an APK of a different version than its tag says.
      - name: verify the tag matches the version
        run: |
          version="$(cat VERSION)"
          tag_version="${RELEASE_TAG#v}"
          if [ "$version" != "$tag_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match VERSION $version"
            exit 1
          fi
          echo "Releasing version $version"

      # The keystore is decoded into the runner's temp directory. The password
      # is never written to disk - it is passed to Gradle through the
      # environment.
      - name: unpack the release key
        env:
          KEYSTORE_B64: ${{ secrets.WHEREQ_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::WHEREQ_RELEASE_KEYSTORE_B64 is not set - the release cannot be signed"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"
          echo "WHEREQ_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: build the release APK
        env:
          WHEREQ_RELEASE_STORE_PASS: ${{ secrets.WHEREQ_RELEASE_STORE_PASS }}
          WHEREQ_RELEASE_ALIAS: ${{ secrets.WHEREQ_RELEASE_ALIAS }}
        run: ./android/gradlew --project-dir android :app:assembleRelease --console=plain

      - name: stage the APK and its checksum
        id: stage
        run: |
          # The published file is named after the *version*, not the tag:
          # "whereq-dosbox-1.0.0.12.apk", the same name the download link in
          # downloads/ points at. The APK is built here and nowhere else, so
          # the file people download is the one that was signed and verified.
          apk="whereq-dosbox-${RELEASE_TAG#v}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          ls -la "$apk" "$apk.sha256"
          cat "$apk.sha256"
          echo "file=$apk" >> "$GITHUB_OUTPUT"

      # A release-signed APK has to carry the certificate of every previous
      # release, otherwise Android refuses to install it over the old one.
      - name: verify the release certificate
        run: |
          apk="whereq-dosbox-${RELEASE_TAG#v}.apk"
          expected="b16b480d5a1ff6d35baff0b15fa3fc4b0ee815e500861fbff1b062c9bf7d3933"
          "$ANDROID_SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs "$apk" \
            | tee certificate.txt
          actual="$(grep -o '[0-9a-f]\{64\}' certificate.txt | head -1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The APK is signed with $actual, expected $expected"
            exit 1
          fi
          echo "release certificate verified"

      - name: check that all three ABIs are in the APK
        run: |
          apk="whereq-dosbox-${RELEASE_TAG#v}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libdosbox.so" \
              || { echo "::error::$abi is missing from the APK"; exit 1; }
          done
          echo "all three ABIs are packaged"

      - name: publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="whereq-dosbox-${RELEASE_TAG#v}.apk"
          version="${RELEASE_TAG#v}"
          # The prose of the release lives in the repository, in
          # docs/releases/<version>.md, so it is reviewed, versioned and
          # changed in the same commit as the code it describes. When the file
          # is there its text is the body of the release; when it is not, the
          # release still gets the machine facts below.
          notes="docs/releases/${version}.md"
          {
            echo "**WhereQ-DOSBox ${RELEASE_TAG}**"
            echo
            if [ -f "$notes" ]; then
              # {{TAG}} and {{VERSION}} are replaced with the tag and the
              # version, so the notes can point at a screenshot that is
              # pinned to this tag and can never drift from it.
              sed -e "s|{{TAG}}|${RELEASE_TAG}|g" \
                  -e "s|{{VERSION}}|${version}|g" "$notes"
              echo
              echo "---"
              echo
            fi
            echo "The Android port of DOSBox. The APK is signed with the release key"
            echo "of this repository, so it can be installed over the previous"
            echo "version without uninstalling it first."
            echo
            echo "\`${apk}\` — SHA-256:"
            echo
            echo '```'
            cat "$apk.sha256"
            echo '```'
            echo
            echo "Signing certificate (SHA-256):"
            echo
            echo '```'
            echo "b16b480d5a1ff6d35baff0b15fa3fc4b0ee815e500861fbff1b062c9bf7d3933"
            echo '```'
          } > release-notes.md
          cat release-notes.md
          # A tag can be re-cut: the release may already exist, and then the
          # notes and the assets are replaced in place instead of the step
          # failing on "already exists". A re-cut keeps the version and the
          # versionCode, so the APK still installs over the one it replaces.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "the release $RELEASE_TAG exists already - updating it in place"
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "$apk" "$apk.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              "$apk" "$apk.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: whereq-dosbox-apk-${{ env.RELEASE_TAG }}
          path: |
            ${{ steps.stage.outputs.file }}
            ${{ steps.stage.outputs.file }}.sha256
          if-no-files-found: error
