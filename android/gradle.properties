# Gradle settings for the whereq-dosbox Android build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The app uses no AndroidX / Jetpack libraries at all (SDL2 is statically
# linked into libdosbox.so and the Java side only uses the framework), so
# AndroidX is not enabled.
android.useAndroidX=false
android.nonTransitiveRClass=true

# AGP 8.1.4 was only tested up to compileSdk 34. The app itself targets API 21
# and uses no API newer than that, so the "use a newer AGP" warning is noise.
android.suppressUnsupportedCompileSdk=36
